<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinigen Spraybot · 工件生成器</title>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
  </script>
  <style>
    :root{color-scheme:dark;--bg:#0b0e12;--panel:#14191f;--line:#29323c;--muted:#8b98a8;--text:#edf2f7;--accent:#e6a956;--green:#79d9b4;--red:#fb755f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-width:1100px;height:100vh;overflow:auto}
    button,select,input,textarea{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--line);background:#0e1217;border-radius:8px;padding:9px 11px}button{cursor:pointer}button:hover{border-color:#627181}button.primary{background:var(--accent);border-color:var(--accent);color:#1b1308;font-weight:700}button:disabled{opacity:.55;cursor:wait}
    #app{height:100vh}.layout{height:100%;display:grid;gap:12px;padding:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-width:0;min-height:0}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:10px;font-weight:700}.title{font-size:16px;font-weight:680;margin:2px 0 12px}.subtle{color:var(--muted)}
    .config{padding:15px;display:flex;flex-direction:column;gap:12px;overflow:auto}.config label{display:grid;gap:5px;color:#b9c3cf;font-size:12px}.config select,.config input{width:100%}.control-section{display:grid;gap:10px;padding:12px;background:#0f141a;border:1px solid var(--line);border-radius:10px}.control-section h2{font-size:13px;margin:0}.control-section p{font-size:11px;color:var(--muted);margin:0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.run-status{font-size:12px;color:var(--muted);min-height:36px;border-top:1px solid var(--line);padding-top:9px}.run-status[data-kind=success]{color:var(--green)}.run-status[data-kind=error]{color:#ff998a}
    .viewer{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#28313b 0%,#13181e 48%,#0d1116 100%);min-height:360px}.viewer canvas{width:100%;height:100%;display:block}.view-head{position:absolute;left:14px;right:14px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}.view-head>*{pointer-events:auto}.field-select{width:210px;background:#131920eF}.view-toggle{display:flex;align-items:center;gap:5px;background:#131920ef;padding:6px 8px;border-radius:7px;font-size:11px;white-space:nowrap}.view-toggle input{margin:0;accent-color:var(--accent)}.view-hint{font-size:11px;color:#98a4b2;background:#0c1016c9;padding:6px 9px;border-radius:7px}.corner-button{position:absolute;right:13px;bottom:13px;background:#151c24dd;font-size:11px}.empty-hint{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);text-align:center;color:#aab6c2;pointer-events:none}.empty-hint b{display:block;color:#edf2f7;font-size:17px;margin-bottom:6px}
    .inspector{padding:15px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}.inspector h2{font-size:14px;margin:0}.inspector-section{display:grid;gap:9px;padding:13px;background:#10151b;border:1px solid var(--line);border-radius:10px}.inspector-section h3{font-size:13px;margin:0}.inspector-section p{font-size:11px;color:var(--muted);margin:0}.inspector-section textarea{width:100%;resize:vertical;min-height:52px}.feedback-field{display:grid;gap:4px;color:#b9c3cf;font-size:12px}.review-state{padding:7px 9px;border-radius:7px;background:#1b2730;font-weight:700}.review-history div{padding:6px 0;border-bottom:1px solid var(--line)}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;background:#0e1217;border:1px solid #222b34;border-radius:9px}.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.stat span{font-size:10px;color:var(--muted)}pre{white-space:pre-wrap;overflow:auto;background:#0c1015;padding:10px;border-radius:8px;color:#bdc8d5;font:11px/1.5 ui-monospace,SFMono-Regular,monospace;margin:0}.face-readout{padding:10px;background:#0e1217;border-radius:8px;font:11px ui-monospace,monospace;color:#ccd5df;min-height:45px;white-space:pre-line}.legend{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}.swatch{width:54px;height:10px;border-radius:4px;background:linear-gradient(90deg,#405064,#e6a956)}
    .layout{grid-template-columns:250px minmax(500px,1fr) 390px}.layout .config{grid-column:1;grid-row:1}.layout .viewer{grid-column:2;grid-row:1}.layout .inspector{grid-column:3;grid-row:1}details summary{cursor:pointer;color:#bdc8d5}details pre{margin-top:8px}
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import * as THREE from 'three';
    import { evaluateSurface } from '/parametric-surfaces.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Selected layout A: configuration, interactive model, and face inspector side by side.
    const state = {generators:[], generator:'', seed:0, field:'geometry_accessible', meshVisible:true, paramVisible:false, trajectoryVisible:false, trajectoryAllVisible:false, trajectory:null, trajectoryStroke:0, data:null, busy:false, status:'载入生成接口…', statusKind:'', selectedFace:null, reviewRoot:null, reviewIndex:null, reviewInterface:'', reviewEpisode:''};
    let reviewLoadRequest=0;
    const app = document.querySelector('#app');
    const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const reviewFields=[['model','模型几何'],['spray_part','spray_part · 部件'],['spray_target','spray_target · 目标面'],['spray_target_reason','spray_target_reason · 排除原因'],['geometry_accessible','geometry_accessible · 外部连通'],['max_passable_radius_m','max_passable_radius_m · 通路净空'],['structure_priors','structure_priors · 结构先验'],['parametric','parametric · 参数化描述']];
    const reviewStatusName={pending:'待审查',accepted:'通过',needs_fix:'需要修复',rejected:'拒绝（历史状态）'};

    function controlsMarkup(){return `
      <div class="brand"><div class="eyebrow">Infinigen · Spraybot</div><div class="title">工件生成实验台</div></div>
      <section class="control-section"><h2>加载已有审查样本</h2><p>选择接口和 seed 后自动读取已有样本，不重新生成。</p><label>搜索接口<input id="review-search" type="search" placeholder="按 id 或工件名过滤"></label><div class="row"><select id="review-interface"><option value="">未加载</option></select><select id="review-episode"><option value="">seed</option></select></div></section>
      <section class="control-section"><h2>现场生成新样本</h2><p>从注册接口生成指定 seed；耗时取决于模型复杂度。</p><label>搜索接口<input id="generator-search" type="search" placeholder="按 id 或工件名过滤"></label><label>生成接口<select id="generator"></select></label><div class="row"><label>随机种子<input id="seed" type="number" min="0" max="2147483647" value="${state.seed}"></label><button id="generate" class="primary" ${state.busy?'disabled':''}>${state.busy?'生成中…':'生成模型'}</button></div></section>
      <div class="run-status" data-kind="${state.statusKind}">${safe(state.status)}</div>`;}
    function fieldMarkup(){return `<div class="view-head"><label>面字段 <select class="field-select" id="field-mode"><option value="none">模型外观</option><option value="spray_target">spray_target · 涂装目标</option><option value="spray_target_reason">spray_target_reason · 非目标原因</option><option value="geometry_accessible">geometry_accessible · 外部连通</option><option value="max_passable_radius_m">max_passable_radius_m · 通路净空</option><option value="part_id">spray_part · 部件类型</option></select></label><label class="view-toggle"><input id="show-mesh" type="checkbox" ${state.meshVisible?'checked':''}>显示模型</label><label class="view-toggle"><input id="show-param" type="checkbox" ${state.paramVisible?'checked':''}>显示参数化描述</label><label class="view-toggle"><input id="show-trajectory" type="checkbox" ${state.trajectoryVisible?'checked':''}>显示轨迹</label><span class="view-hint">拖动旋转 · 滚轮缩放</span></div>`;}
    function trajectoryCurrentText(){const t=state.trajectory,index=state.trajectoryStroke,v=t.visibility,source=t.stroke_sources[index];const flag=!v?'未做射线检查':v.blocked_stroke_ids.includes(index)?'喷射视线遮挡':v.missed_stroke_ids.includes(index)?'射线未命中':'中点射线畅通';return `第 ${index+1}/${t.strokes.length} 条 · ${flag}\n${source?.part||''} · ${source?.surface||''}`;}
    function trajectoryMarkup(){const t=state.trajectory,c=t?.check,v=t?.visibility;const index=state.trajectoryStroke;return `<section class="inspector-section"><h3>喷涂轨迹（当前样本）</h3>${t?`<div class="face-readout">${safe(c.stroke_count)} 条笔画 · ${safe(c.waypoint_count)} 个路径点${v?`<br>中点射线：${safe(v.clear_strokes)} 畅通 · ${safe(v.blocked_stroke_ids.length)} 遮挡 · ${safe(v.missed_stroke_ids.length)} 未命中`:'<br>尚未做中点射线检查'}${c.target_centroid_within_threshold_fraction!==undefined?`<br>目标面中心距 ≤ ${Number(c.coverage_threshold_mm).toFixed(1)} mm：${(100*c.target_centroid_within_threshold_fraction).toFixed(2)}%`:' '}</div><label class="feedback-field">笔画顺序 <input id="trajectory-stroke" type="range" min="0" max="${t.strokes.length-1}" value="${index}"></label><div class="row"><input id="trajectory-stroke-number" type="number" min="0" max="${t.strokes.length-1}" value="${index}"><button type="button" id="trajectory-next-issue" ${v?'':'disabled'}>下一个异常</button></div><label class="view-toggle"><input id="show-all-trajectories" type="checkbox" ${state.trajectoryAllVisible?'checked':''}>显示所有笔画</label><div class="face-readout" id="trajectory-current">${safe(trajectoryCurrentText())}</div><p>${c.strategy?'当前为部件级轨迹试验，尚未通过轨迹审查。':''}紫到青表示顺序；红色为遮挡、黄色为未命中、橙色为当前笔画。箭头表示喷向。这里只检查每笔中点的喷射射线，不代表机器人可达或全路径无碰撞。</p>`:'尚无配套轨迹。'}</section>`;}
    function issueHistoryMarkup(){const issues=state.review?.field_issues||[];return issues.length?issues.map(issue=>`<div><b>seed ${safe(issue.seed)} · ${safe(reviewFields.find(field=>field[0]===issue.field)?.[1]||issue.field)}</b><br>${safe(issue.note)}</div>`).join(''):'尚无字段问题。';}
    function priorReviewMarkup(){const history=state.review?.review_history||[];return history.map(item=>{const review=item.human_review||{};return `<div><b>${safe(review.status||'unknown')} · ${safe(review.reviewer||'未记录审查人')} · ${safe(review.reviewed_at||'')}</b><p>${safe(review.notes||'无总体备注')}</p>${(review.field_issues||[]).map(issue=>`<p>seed ${safe(issue.seed)} · ${safe(issue.field)}：${safe(issue.note)}</p>`).join('')}</div>`;}).join('');}
    function feedbackMarkup(){return reviewFields.map(([field,label])=>{const issue=(state.review?.field_issues||[]).find(item=>item.seed===state.data?.seed&&item.field===field);return `<label class="feedback-field">${safe(label)}<textarea data-review-field="${field}" rows="2" placeholder="当前 seed 此字段有问题时填写；留空表示无问题">${safe(issue?.note||'')}</textarea></label>`;}).join('');}
    function inspectorMarkup(){const bundle=state.data?.parametric;const surfaceCount=bundle?.parts?.reduce((n,part)=>n+(part.surfaces?.length||0),0)||0;const priors=state.data?JSON.stringify(state.data.structure_priors,null,2):'—';const priorPreview=priors.length>12000?`${priors.slice(0,12000)}\n…（预览已截断，共 ${priors.length.toLocaleString()} 字符；可下载完整 JSON）`:priors;const reviewAllowed=!!state.reviewIndex?.interfaces?.find(item=>item.id===state.data?.generator)?.review_enabled;return `
      <section class="panel inspector">
        <section class="inspector-section"><h3>当前样本</h3><h2>${state.data?safe(state.data.generator):'等待加载'}</h2><div class="subtle">${state.data?`seed ${state.data.seed}`:'从左栏加载已有样本或现场生成'}</div><div class="stat-grid"><div class="stat"><b>${state.data?.triangle_count?.toLocaleString()??'—'}</b><span>三角面</span></div><div class="stat"><b>${state.data?.vertex_count?.toLocaleString()??'—'}</b><span>顶点</span></div><div class="stat"><b>${state.data?`${state.data.geometry_accessible.filter(Boolean).length}/${state.data.triangle_count}`:'—'}</b><span>外部可达面</span></div><div class="stat"><b>${state.data?`${(state.data.max_passable_radius_p95_m*1000).toFixed(1)} mm`:'—'}</b><span>通路半径 p95</span></div></div></section>
        <section class="inspector-section"><h3>模型逐面字段</h3><div class="legend"><i class="swatch"></i><span id="field-legend">${safe(legendText())}</span></div><div class="face-readout" id="face-readout">${state.selectedFace===null?'显示模型并点击表面，可读取这个三角面的字段。':`triangle ${state.selectedFace}`}</div></section>
        <section class="inspector-section"><h3>参数化描述</h3><div class="face-readout">${state.data?`${safe(state.data.parametric_description_status||'unknown')} · ${safe(bundle?.schema||state.data.parametric_incomplete_reason||'无参数曲面')}`:'加载后显示状态。'}</div><div class="subtle">${bundle?`${bundle.parts.length} 个实例 · ${surfaceCount.toLocaleString()} 个参数面；打开“显示参数化描述”看采样点/线。CSG 的闭合彩线是裁剪边界，包含孔洞边界。`:'参数描述尚未加载。'}</div></section>
        ${state.trajectoryVisible?trajectoryMarkup():''}
        <section class="inspector-section"><h3>部件图例</h3><pre>${state.data?safe(JSON.stringify(state.data.part_legend,null,2)):'—'}</pre><h3>structure_priors（可选）</h3><p>null 表示此接口没有专用结构先验；参数描述仍见上方。</p>${state.data?.structure_priors?`<details><summary>展开结构先验（${priors.length.toLocaleString()} 字符）</summary><pre>${safe(priorPreview)}</pre></details><button type="button" id="download-priors">下载完整结构先验 JSON</button>`:`<div class="subtle">${state.data?'null':'加载后显示'}</div>`}</section>
        <section class="inspector-section"><h3>接口级人工审查</h3><div class="review-state" id="review-state">${safe(reviewStatusName[state.review?.status||'pending']||'待审查')} · ${safe(state.review?.interface_status||'developing')}${state.review?.committed===false?'（待 Git 提交）':''}</div><p>状态属于整个接口；下方非空反馈自动绑定当前 seed ${state.data?.seed??'—'}。保存到项目仓库后，Git 提交才使结论正式生效。</p><div class="row"><select id="review-status" ${reviewAllowed?'':'disabled'}><option value="pending">待审查</option><option value="accepted">通过</option><option value="needs_fix">需要修复</option></select><button type="button" id="save-review" ${reviewAllowed?'':'disabled'}>${reviewAllowed?'保存到仓库':'待本接口机器门禁'}</button></div><label class="feedback-field">审查人<input id="reviewer" value="${safe(state.review?.reviewer||'')}" placeholder="填写审查人"></label><label class="feedback-field">接口总体备注<textarea id="review-notes" rows="2" placeholder="跨 seed 的整体判断">${safe(state.review?.notes||'')}</textarea></label>${feedbackMarkup()}<h3>已保存的字段问题</h3><div class="review-history" id="review-issues">${issueHistoryMarkup()}</div>${state.review?.review_history?.length?`<details><summary>既往审查记录（${state.review.review_history.length}）</summary><div class="review-history">${priorReviewMarkup()}</div></details>`:''}</section>
      </section>`;}
    function renderLayout(){
      const controls=`<form class="panel config" id="controls">${controlsMarkup()}</form>`;
      const viewer=`<section class="panel viewer" id="viewer">${fieldMarkup()}${state.data?'':'<div class="empty-hint"><b>准备查看工件</b>选择生成接口与种子，生成后拖动旋转、滚轮缩放</div>'}<button class="corner-button" id="reset-view">重置视角</button></section>`;
      const inspector=inspectorMarkup();
      app.innerHTML=`<div class="layout">${controls}${viewer}${inspector}</div>`;
      const selector=document.querySelector('#generator');
      const fillGenerators=(query='')=>{const q=query.trim().toLowerCase();const visible=state.generators.filter(g=>!q||`${g.id} ${g.label}`.toLowerCase().includes(q));const groups=[...new Set(visible.map(g=>g.group))];selector.innerHTML=groups.map(group=>`<optgroup label="${safe(group)}">${visible.filter(g=>g.group===group).map(g=>`<option value="${safe(g.id)}" ${g.id===state.generator?'selected':''}>${safe(g.label)}</option>`).join('')}</optgroup>`).join('');if(!visible.some(g=>g.id===state.generator))state.generator=visible[0]?.id||'';selector.value=state.generator;};
      fillGenerators(document.querySelector('#generator-search')?.value||'');
      selector.value=state.generator;
      document.querySelector('#controls').addEventListener('submit',event=>{event.preventDefault();generateModel();});
      document.querySelector('#generator').addEventListener('change',event=>{state.generator=event.target.value;state.status=`接口已选：${state.generator}`;state.statusKind='';renderLayout();});
      document.querySelector('#generator-search').addEventListener('input',event=>{fillGenerators(event.target.value);});
      document.querySelector('#seed').addEventListener('change',event=>{state.seed=Math.max(0,Number(event.target.value)||0);state.status=`随机种子：${state.seed}`;state.statusKind='';updateStatus();});
      const field=document.querySelector('#field-mode');if(field){field.value=state.field;
      field.addEventListener('change',event=>{state.field=event.target.value;state.selectedFace=null;document.querySelector('#face-readout').textContent='点击模型表面查看逐面字段。';state.status=`字段显示：${state.field}`;state.statusKind='';mountScene();updateStatus();});}
      document.querySelector('#show-mesh').addEventListener('change',event=>{state.meshVisible=event.target.checked;state.selectedFace=null;mountScene();});
      document.querySelector('#show-param')?.addEventListener('change',event=>{state.paramVisible=event.target.checked;state.selectedFace=null;mountScene();});
      document.querySelector('#show-trajectory').addEventListener('change',event=>setTrajectoryVisible(event.target.checked));
      document.querySelector('#show-all-trajectories')?.addEventListener('change',event=>{state.trajectoryAllVisible=event.target.checked;mountScene();});
      const chooseStroke=value=>{if(!state.trajectory)return;state.trajectoryStroke=Math.max(0,Math.min(state.trajectory.strokes.length-1,Number(value)||0));document.querySelector('#trajectory-stroke').value=state.trajectoryStroke;document.querySelector('#trajectory-stroke-number').value=state.trajectoryStroke;document.querySelector('#trajectory-current').textContent=trajectoryCurrentText();mountSelectedTrajectoryStroke();};
      document.querySelector('#trajectory-stroke')?.addEventListener('input',event=>chooseStroke(event.target.value));
      document.querySelector('#trajectory-stroke-number')?.addEventListener('change',event=>chooseStroke(event.target.value));
      document.querySelector('#trajectory-next-issue')?.addEventListener('click',()=>{const v=state.trajectory?.visibility;if(!v)return;const issues=[...v.blocked_stroke_ids,...v.missed_stroke_ids].sort((a,b)=>a-b);chooseStroke(issues.find(i=>i>state.trajectoryStroke)??issues[0]??state.trajectoryStroke);});
      document.querySelector('#reset-view').addEventListener('click',()=>{state.status='视角已重置';state.statusKind='';updateStatus();mountScene();});
      const reviewSelector=document.querySelector('#review-interface');
      const fillReviewInterfaces=(query='')=>{const q=query.trim().toLowerCase();const visible=(state.reviewIndex?.interfaces||[]).filter(i=>!q||`${i.id} ${i.label}`.toLowerCase().includes(q));reviewSelector.innerHTML=`<option value="">${state.reviewIndex?'选择接口':'未加载 review root'}</option>`+visible.map(i=>`<option value="${safe(i.id)}">${safe(i.label)}</option>`).join('');reviewSelector.value=visible.some(i=>i.id===state.reviewInterface)?state.reviewInterface:'';const item=visible.find(i=>i.id===reviewSelector.value);const episodeSelector=document.querySelector('#review-episode');episodeSelector.innerHTML='<option value="">seed</option>'+(item?.episodes||[]).map(e=>`<option value="${safe(e)}">${safe(e)}</option>`).join('');episodeSelector.value=(item?.episodes||[]).includes(state.reviewEpisode)?state.reviewEpisode:'';};
      fillReviewInterfaces();document.querySelector('#review-search').addEventListener('input',event=>fillReviewInterfaces(event.target.value));
      reviewSelector.addEventListener('change',event=>{reviewLoadRequest++;state.reviewInterface=event.target.value;state.reviewEpisode='';state.data=null;state.review=null;state.trajectory=null;renderLayout();});
      document.querySelector('#review-episode').addEventListener('change',event=>{state.reviewEpisode=event.target.value;if(state.reviewEpisode)loadReviewEpisode();else reviewLoadRequest++;});
      document.querySelector('#save-review')?.addEventListener('click',saveHumanReview);
      document.querySelector('#download-priors')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state.data.structure_priors,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`${state.data.generator.replace(':','-')}-seed-${state.data.seed}-structure-priors.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
      if(state.review?.status)document.querySelector('#review-status').value=state.review.status;
      mountScene();updateStatus();
    }
    function legendText(){if(state.field==='spray_target')return '灰 = 非目标 · 红 = 目标';if(state.field==='spray_target_reason')return '绿 = 目标 · 黄 = 材料 · 紫 = 部件策略 · 蓝 = 内腔';if(state.field==='geometry_accessible')return '橙 = 不连通 · 青 = 外部可达';if(state.field==='max_passable_radius_m')return `蓝 0 m → 红 ${Number(state.data?.max_passable_radius_p95_m||0).toFixed(4)} m (p95)`;if(state.field==='part_id')return '颜色区分 spray_part 部件编号';return '默认材质色';}
    function updateStatus(){for(const el of document.querySelectorAll('.run-status')){el.textContent=state.status;el.dataset.kind=state.statusKind;}const legend=document.querySelector('#field-legend');if(legend)legend.textContent=legendText();}
    async function loadGenerators(){try{const response=await fetch('/api/generators');if(!response.ok)throw new Error('接口目录读取失败');state.generators=await response.json();state.generator=state.generators[0]?.id||'';const root=await fetch('/api/review-root');if(root.ok){state.reviewIndex=await root.json();state.reviewRoot=state.reviewIndex.root;}state.status=`已载入 ${state.generators.length} 个生成接口${state.reviewRoot?' · review root 已连接':''}`;state.statusKind='success';renderLayout();}catch(error){state.status=error.message;state.statusKind='error';updateStatus();}}
    async function fetchTrajectory(generator,seed){const response=await fetch(`/api/trajectory/${encodeURIComponent(generator)}/seed_${String(seed).padStart(10,'0')}`);return response.ok?await response.json():null;}
    async function setTrajectoryVisible(visible){state.trajectoryVisible=visible;const current=state.data,request=reviewLoadRequest;if(!visible||!current||state.trajectory){renderLayout();return;}state.status=`读取 ${current.generator} · seed ${current.seed} 的轨迹…`;state.statusKind='';renderLayout();try{const trajectory=await fetchTrajectory(current.generator,current.seed);if(request!==reviewLoadRequest||state.data!==current)return;state.trajectory=trajectory;state.trajectoryStroke=0;state.status=trajectory?'配套轨迹已加载':'此样本尚无配套轨迹';state.statusKind=trajectory?'success':'';renderLayout();}catch(error){if(request!==reviewLoadRequest)return;state.status=`轨迹读取失败：${error.message}`;state.statusKind='error';updateStatus();}}

    async function loadReviewEpisode(){const generator=document.querySelector('#review-interface').value;const episode=document.querySelector('#review-episode').value;if(!generator||!episode)return;const request=++reviewLoadRequest;state.status=`加载 ${generator} · ${episode}…`;state.statusKind='';updateStatus();try{const response=await fetch(`/api/review/${encodeURIComponent(generator)}/episodes/${encodeURIComponent(episode)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'读取 review episode 失败');const reviewResponse=await fetch(`/api/review/${encodeURIComponent(generator)}/review`);const review=reviewResponse.ok?await reviewResponse.json():null;const trajectory=state.trajectoryVisible?await fetchTrajectory(generator,data.seed):null;if(request!==reviewLoadRequest)return;state.review=review;state.data=data;state.trajectory=trajectory;state.trajectoryStroke=0;state.generator=generator;state.seed=data.seed;state.reviewInterface=generator;state.reviewEpisode=episode;state.status=`已加载 review root：${generator} · seed ${data.seed}${trajectory?' · 轨迹已加载':''}`;state.statusKind='success';state.selectedFace=null;renderLayout();}catch(error){if(request!==reviewLoadRequest)return;state.status=error.message;state.statusKind='error';updateStatus();}}
    async function saveHumanReview(){if(!state.reviewRoot||!state.data){state.status='请先加载审查样本';state.statusKind='error';updateStatus();return;}const seed=state.data.seed;const other=(state.review?.field_issues||[]).filter(issue=>issue.seed!==seed);const current=[...document.querySelectorAll('[data-review-field]')].map(input=>({seed,field:input.dataset.reviewField,note:input.value.trim()})).filter(issue=>issue.note);const fieldIssues=[...other,...current];const status=document.querySelector('#review-status').value;if(status==='accepted'&&fieldIssues.length){state.status='仍有字段问题；清除或修复后再标记通过';state.statusKind='error';updateStatus();return;}const request={interface_id:state.data.generator,status,reviewer:document.querySelector('#reviewer').value.trim(),notes:document.querySelector('#review-notes').value,field_issues:fieldIssues,seed_issues:state.review?.seed_issues||[]};try{const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const data=await response.json();if(!response.ok)throw new Error(data.error||'保存审查失败');state.review={...request,review_history:state.review?.review_history||[],interface_status:data.interface_status,committed:false};document.querySelector('#review-state').textContent=`${reviewStatusName[status]} · ${data.interface_status}（待 Git 提交）`;document.querySelector('#review-issues').innerHTML=issueHistoryMarkup();state.status=`已写入仓库；当前 seed ${seed} 的字段反馈已关联，待 Git 提交`;state.statusKind='success';updateStatus();}catch(error){state.status=error.message;state.statusKind='error';updateStatus();}}
    async function generateModel(){if(state.busy)return;reviewLoadRequest++;state.seed=Math.max(0,Number(document.querySelector('#seed').value)||0);state.generator=document.querySelector('#generator').value;state.busy=true;state.status=`生成 ${state.generator} · seed ${state.seed}…`;state.statusKind='';renderLayout();try{const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({generator:state.generator,seed:state.seed})});const data=await response.json();if(!response.ok)throw new Error(data.error||'生成失败');state.data=data;const reviewResponse=await fetch(`/api/review/${encodeURIComponent(data.generator)}/review`);state.review=reviewResponse.ok?await reviewResponse.json():null;state.trajectory=state.trajectoryVisible?await fetchTrajectory(data.generator,data.seed):null;state.trajectoryStroke=0;state.selectedFace=null;state.status=`生成完成：${data.triangle_count.toLocaleString()} 面 · seed ${data.seed}`;state.statusKind='success';}catch(error){state.status=error.message;state.statusKind='error';}finally{state.busy=false;renderLayout();}}

    let renderer=null,scene=null,camera=null,controls=null,resizeObserver=null,raycaster=null,trajectorySelection=null;
    function disposeScene(){if(resizeObserver)resizeObserver.disconnect();if(controls)controls.dispose();if(renderer){renderer.setAnimationLoop(null);renderer.dispose();renderer.domElement.remove();}renderer=scene=camera=controls=raycaster=trajectorySelection=null;}
    function faceColor(index){const d=state.data;if(!d)return new THREE.Color('#98a6b5');if(state.field==='spray_target')return new THREE.Color(d.spray_target[index]?'#ee654c':'#3a434e');if(state.field==='spray_target_reason')return new THREE.Color(['#35c49a','#f1bd59','#bd82ee','#62a9f5'][d.spray_target_reason[index]]||'#8995a2');if(state.field==='geometry_accessible')return new THREE.Color(d.geometry_accessible[index]?'#35c49a':'#f07b51');if(state.field==='max_passable_radius_m'){const max=Math.max(d.max_passable_radius_p95_m,1e-9),t=Math.min(1,d.max_passable_radius_m[index]/max);return new THREE.Color().setHSL(.67*(1-t),.78,.48);}if(state.field==='part_id'){const id=Math.max(0,d.part_id[index]);return new THREE.Color().setHSL((id*.173)%1,.55,.55);}return new THREE.Color('#98a6b5');}
    function mountScene(){disposeScene();const host=document.querySelector('#viewer');if(!host)return;const canvasHost=host;renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;canvasHost.prepend(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(42,host.clientWidth/host.clientHeight,.001,1000);camera.up.set(0,0,1);camera.position.set(2.7,-3.4,2.4);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);raycaster=new THREE.Raycaster();scene.add(new THREE.HemisphereLight(0xe6efff,0x30343a,2.0));const key=new THREE.DirectionalLight(0xffe0bd,3.0);key.position.set(-3,-4,6);scene.add(key);const fill=new THREE.DirectionalLight(0x9bc8ff,1.25);fill.position.set(4,3,2);scene.add(fill);const grid=new THREE.GridHelper(5,20,0x3e4c5a,0x26313c);grid.rotation.x=Math.PI/2;grid.position.z=-.01;scene.add(grid);
      if(state.data){const positions=[],colors=[];for(let i=0;i<state.data.triangles.length;i++){const c=faceColor(i);for(const vertexIndex of state.data.triangles[i]){positions.push(...state.data.vertices[vertexIndex]);colors.push(c.r,c.g,c.b);}}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geometry.computeVertexNormals();const material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.72,metalness:.02,side:THREE.DoubleSide});const object=new THREE.Mesh(geometry,material);object.visible=state.meshVisible;scene.add(object);if(state.paramVisible)mountParametricOverlay();if(state.trajectoryVisible&&state.trajectory)mountTrajectoryOverlay();geometry.computeBoundingBox();const center=geometry.boundingBox.getCenter(new THREE.Vector3()),size=geometry.boundingBox.getSize(new THREE.Vector3()),extent=Math.max(size.x,size.y,size.z,1e-3);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1.8,-2.6,1.65).normalize().multiplyScalar(extent*2.5));camera.near=extent/1000;camera.far=extent*30;camera.updateProjectionMatrix();controls.minDistance=extent*.25;controls.maxDistance=extent*12;}
      const render=()=>{if(!renderer)return;controls.update();renderer.render(scene,camera);};renderer.setAnimationLoop(render);resizeObserver=new ResizeObserver(()=>{if(!renderer)return;camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight);});resizeObserver.observe(host);renderer.domElement.addEventListener('click',event=>{if(!state.data||!state.meshVisible)return;const rect=renderer.domElement.getBoundingClientRect();raycaster.setFromCamera(new THREE.Vector2((event.clientX-rect.left)/rect.width*2-1,-((event.clientY-rect.top)/rect.height)*2+1),camera);const hit=raycaster.intersectObjects(scene.children.filter(object=>object.isMesh&&object.visible))[0];if(hit){state.selectedFace=hit.faceIndex;const i=hit.faceIndex;document.querySelector('#face-readout').textContent=`triangle ${i} | part ${state.data.part_id[i]} (${state.data.part_legend[String(state.data.part_id[i])]??'unknown'}) | target ${state.data.spray_target[i]} | target reason ${state.data.spray_target_reason_legend[String(state.data.spray_target_reason[i])]??'unknown'} | accessible ${state.data.geometry_accessible[i]} | max radius ${Number(state.data.max_passable_radius_m[i]).toFixed(5)} m`;state.status=`选中三角面 ${i}`;state.statusKind='success';updateStatus();}});}

    function mountTrajectoryOverlay(){const t=state.trajectory,blocked=new Set(t.visibility?.blocked_stroke_ids||[]),missed=new Set(t.visibility?.missed_stroke_ids||[]);if(state.trajectoryAllVisible){const vertices=[],colors=[],color=new THREE.Color();t.strokes.forEach((stroke,id)=>{color.setHSL(.72-.22*id/Math.max(1,t.strokes.length-1),.85,.57);if(blocked.has(id))color.set('#ff5262');else if(missed.has(id))color.set('#ffd166');for(let i=1;i<stroke.points.length;i++){vertices.push(...stroke.points[i-1],...stroke.points[i]);colors.push(color.r,color.g,color.b,color.r,color.g,color.b);}});const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));const all=new THREE.LineSegments(geometry,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.7,depthTest:false}));all.renderOrder=2;scene.add(all);}mountSelectedTrajectoryStroke();}
    function mountSelectedTrajectoryStroke(){if(trajectorySelection){scene.remove(trajectorySelection);trajectorySelection.traverse(object=>{object.geometry?.dispose();object.material?.dispose();});}if(!scene||!state.trajectoryVisible||!state.trajectory)return;trajectorySelection=new THREE.Group();const stroke=state.trajectory.strokes[state.trajectoryStroke];if(!stroke)return;const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(stroke.points.flat(),3));const line=new THREE.Line(geometry,new THREE.LineBasicMaterial({color:0xffa640,depthTest:false}));line.renderOrder=3;trajectorySelection.add(line);const stride=Math.max(1,Math.ceil(stroke.points.length/8));for(let i=0;i<stroke.points.length;i+=stride){const arrow=new THREE.ArrowHelper(new THREE.Vector3(...stroke.aims[i]).normalize(),new THREE.Vector3(...stroke.points[i]),.045,0xffce7b,.014,.007);trajectorySelection.add(arrow);}scene.add(trajectorySelection);}

    function mountParametricOverlay(){
      const bundle=state.data?.parametric;if(!bundle)return;
      const surfaceCount=(bundle.parts||[]).reduce((count,part)=>count+(part.surfaces?.length||0),0);
      const steps=surfaceCount>5000?1:surfaceCount>1500?2:6;
      const positions=[],colors=[],lines=[],lineColors=[];let index=0,partIndex=0;
      for(const part of bundle.parts||[]){const partColor=new THREE.Color().setHSL((partIndex++*.173)%1,.7,.65);for(const surface of part.surfaces||[]){
        const color=surfaceCount>5000?partColor:new THREE.Color().setHSL((index*.618)%1,.8,.65);index++;
        const sample=(i,j)=>{const [point,normal]=evaluateSurface(surface,i/steps,j/steps);return point.map((x,k)=>x+normal[k]*.0003);};
        if(surface.type==='csg_trimmed_face'){
          const point=(u,v)=>{const [p,n]=evaluateSurface(surface,u,v);return p.map((x,k)=>x+n[k]*.0003);};
          const loops=surface.domain.loops||[];
          for(const loop of loops){const uv=loop.points||[];for(let k=0;k<uv.length;k++){
            const a=point(...uv[k]),b=point(...uv[(k+1)%uv.length]);
            positions.push(...a);colors.push(color.r,color.g,color.b);
            lines.push(...a,...b);lineColors.push(color.r,color.g,color.b,color.r,color.g,color.b);
          }}
          const inside=(u,v)=>{let contained=false;for(const loop of loops){const uv=loop.points||[];for(let k=0,j=uv.length-1;k<uv.length;j=k++){
            const a=uv[k],b=uv[j];if((a[1]>v)!==(b[1]>v)&&u<(b[0]-a[0])*(v-a[1])/(b[1]-a[1])+a[0])contained=!contained;
          }}return contained;};
          for(let i=0;i<=6;i++)for(let j=0;j<=6;j++){const u=(i+.5)/7,v=(j+.5)/7;if(!inside(u,v))continue;positions.push(...point(u,v));colors.push(color.r,color.g,color.b);}
          continue;
        }
        for(let i=0;i<=steps;i++)for(let j=0;j<=steps;j++){
          if(['plane_triangle','sweep_triangle'].includes(surface.type)&&i+j>steps)continue;
          const p=sample(i,j);positions.push(...p);colors.push(color.r,color.g,color.b);
          for(const [di,dj] of [[1,0],[0,1]]){
            if(i+di>steps||j+dj>steps||(['plane_triangle','sweep_triangle'].includes(surface.type)&&i+di+j+dj>steps))continue;
            lines.push(...p,...sample(i+di,j+dj));lineColors.push(color.r,color.g,color.b,color.r,color.g,color.b);
          }
        }
      }}
      const pointsGeometry=new THREE.BufferGeometry();pointsGeometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));pointsGeometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
      scene.add(new THREE.Points(pointsGeometry,new THREE.PointsMaterial({vertexColors:true,size:.004})));
      const lineGeometry=new THREE.BufferGeometry();lineGeometry.setAttribute('position',new THREE.Float32BufferAttribute(lines,3));lineGeometry.setAttribute('color',new THREE.Float32BufferAttribute(lineColors,3));
      scene.add(new THREE.LineSegments(lineGeometry,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.8})));
    }
    renderLayout();loadGenerators();
  </script>
</body>
</html>
